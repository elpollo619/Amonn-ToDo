# ============================================================
# Amonn — para PEGAR en tu NAS Ugreen (Docker → Projekt → Crear)
#
# Reutiliza tu OpenWA Gateway existente conectándose a su MISMA red docker
# ("openwa-network"). Amonn detecta la sesión y registra el webhook SOLO.
#
# Cambia las líneas marcadas con 🔴 (contraseñas inventadas + la API Key del
# Gateway). La misma contraseña de la BD va en DB_PASSWORD y en DATABASE_URL.
#
# 🔄 ACTUALIZACIONES AUTOMÁTICAS: el servicio "watchtower" de abajo comprueba
# cada 5 minutos si hay una imagen nueva de Amonn ("latest") y la actualiza
# solo, sin tocar nada más del NAS (solo actualiza contenedores con la
# etiqueta com.centurylinklabs.watchtower.enable). Así no hay que volver a
# recrear el proyecto en UGOS cada vez. Comprueba qué versión corre con
# http://IP-DEL-NAS:8080/api/version
# ============================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: amonn
      POSTGRES_PASSWORD: CAMBIA_ESTA_CONTRASENA          # 🔴 (1) contraseña de la base de datos
      POSTGRES_DB: amonn
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - amonn
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U amonn']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: ghcr.io/elpollo619/amonn-todo:latest
    container_name: amonn-server
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: 'true'   # Watchtower actualiza SOLO este contenedor
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://amonn:CAMBIA_ESTA_CONTRASENA@db:5432/amonn   # 🔴 (1) MISMA contraseña que arriba
      JWT_SECRET: CAMBIA_ESTA_FRASE_MUY_LARGA_Y_ALEATORIA                   # 🔴 (2) secreto de sesiones

      # ─── Conexión con tu OpenWA Gateway (por la red interna) ───
      WA_API_URL: http://openwa-api:2785          # nombre del contenedor del Gateway (no tocar)
      WA_API_KEY: TU_API_KEY_DEL_GATEWAY          # 🔴 (3) la API Key de tu Gateway
      WA_SESSION_ID: auto                         # Amonn detecta la sesión sola
      # Las respuestas SÍ/NO llegan en tiempo real por Socket.IO (no hace falta
      # webhook ni abrir puertos, y esquiva la protección SSRF del Gateway).
      WA_ENABLED: 'true'

      REMINDER_CRON: '0 9 * * 1-5'    # recordatorios: L-V a las 9:00
      TZ: Europe/Madrid
    networks:
      - amonn
      - openwa-network
    ports:
      - '8080:4000'                   # abre la app en http://IP-DEL-NAS:8080

  # Actualiza Amonn automáticamente cuando se publica una imagen nueva.
  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: amonn-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --interval 300 --cleanup
    environment:
      TZ: Europe/Madrid
      # El Docker de UGOS exige API >= 1.40; sin esto Watchtower falla con
      # "client version 1.25 is too old".
      DOCKER_API_VERSION: '1.41'

networks:
  amonn:
    driver: bridge
  # Tu red existente donde vive el OpenWA Gateway (openwa-api).
  openwa-network:
    external: true
    name: openwa-network
