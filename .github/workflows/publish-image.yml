name: Publicar imagen Docker

# Construye la imagen de Amonn (app web + servidor) y la publica en GHCR
# para poder descargarla directamente en el NAS, sin compilar allí.

on:
  push:
    branches:
      - main
      - claude/job-list-app-whatsapp-av9rwl
    paths:
      - 'app/**'
      - 'server/**'
      - 'Dockerfile'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch: {}

jobs:
  build-and-push:
    # Runner ARM NATIVO. El NAS es aarch64, así que la imagen tiene que ser
    # arm64; construirla aquí de forma nativa evita la emulación QEMU que se
    # colgó dos veces el 15.09.2026. Gratis porque el repositorio es público.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sin QEMU a propósito: el runner ya es ARM, así que «npm ci» corre
      # nativo. No se añada docker/setup-qemu-action ni linux/amd64: la
      # emulación es justo lo que se colgó (más de 30 min) el 15.09.2026, y
      # nadie consume la imagen amd64.
      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos (etiquetas)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/elpollo619/amonn-todo
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construir y publicar (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          # SOLO arm64: el NAS (UGREEN, aarch64) es el único consumidor. Del
          # 15 al 24.09.2026 se publicó amd64 por creer que el NAS era Intel
          # y el servidor estuvo 9 días en bucle de reinicio con
          # «exec format error» — el asistente, mudo. Comprobar con
          # `uname -m` en el NAS antes de tocar esta línea.
          platforms: linux/arm64
          # Manifiesto CLÁSICO (sin índice OCI ni attestations). Al pasar a
          # amd64 solo, buildx publicaba un índice de una plataforma + firma de
          # procedencia, y Watchtower 1.7.1 en el NAS lo daba por «sin cambios»
          # (Scanned=1 Updated=0 durante 36 h, 15–17.09.2026) aunque el digest
          # era otro. Con un manifiesto simple vuelve a detectar la novedad.
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
