name: Publicar imagen Docker

# Construye la imagen de Amonn (app web + servidor) y la publica en GHCR
# para poder descargarla directamente en el NAS, sin compilar allí.

on:
  push:
    branches:
      - main
      - claude/job-list-app-whatsapp-av9rwl
    paths:
      - 'app/**'
      - 'server/**'
      - 'Dockerfile'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar QEMU (para construir también para ARM)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos (etiquetas)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/elpollo619/amonn-todo
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construir y publicar (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
