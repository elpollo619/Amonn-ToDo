name: Publicar imagen Docker

# Construye la imagen de Amonn (app web + servidor) y la publica en GHCR
# para poder descargarla directamente en el NAS, sin compilar allí.

on:
  push:
    branches:
      - main
      - claude/job-list-app-whatsapp-av9rwl
    paths:
      - 'app/**'
      - 'server/**'
      - 'Dockerfile'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sin QEMU: solo se construye para amd64. El NAS (UGREEN DXP6800 Pro,
      # Intel) es amd64 y la emulación ARM se quedó colgada dos veces seguidas
      # el 15.09.2026 (más de 30 minutos en «npm ci» bajo QEMU, con un arreglo
      # urgente esperando). Si algún día hace falta ARM, se añade de nuevo
      # docker/setup-qemu-action y linux/arm64 en platforms.
      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos (etiquetas)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/elpollo619/amonn-todo
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construir y publicar (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          # Manifiesto CLÁSICO (sin índice OCI ni attestations). Al pasar a
          # amd64 solo, buildx publicaba un índice de una plataforma + firma de
          # procedencia, y Watchtower 1.7.1 en el NAS lo daba por «sin cambios»
          # (Scanned=1 Updated=0 durante 36 h, 15–17.09.2026) aunque el digest
          # era otro. Con un manifiesto simple vuelve a detectar la novedad.
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
