# Configuración del proyecto Supabase para Amonn.
# Ajusta project_id con el "reference id" de tu proyecto (Settings → General).
project_id = "amonn-todo"

# El webhook lo llama WhatsApp/Twilio/Meta, que no envían un JWT de Supabase,
# así que desactivamos la verificación de JWT en esas funciones.
[functions.whatsapp-webhook]
verify_jwt = false

[functions.whatsapp-reminders]
verify_jwt = false
